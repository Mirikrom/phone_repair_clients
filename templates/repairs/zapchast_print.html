<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=80mm">
    <title>ZAPCHASTLAR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.35;
            width: 80mm;
            max-width: 80mm;
            padding: 3mm;
            background: #fff;
        }
        .receipt {
            width: 100%;
        }
        .center { text-align: center; }
        .bold { font-weight: bold; }
        .line { border-bottom: 1px dashed #000; margin: 4px 0; }
        .item {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            margin: 3px 0;
            min-height: 18px;
        }
        .checkbox {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            border: 2px solid #000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .item-name { flex: 1; word-break: break-word; }
        .qty { flex-shrink: 0; }
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
        }
        @page { size: 80mm auto; margin: 2mm; }
        .no-print {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button type="button" id="btnLocalPrint" style="padding: 8px 16px; font-size: 14px; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 700;">
            Lokal pechat
        </button>
        <button type="button" id="btnAgentPrint" style="padding: 8px 16px; font-size: 14px; cursor: pointer; background: #16a34a; color: #fff; border: none; border-radius: 6px; font-weight: 700; margin-left: 8px;">
            Printerga yuborish (XP-80)
        </button>
        <button type="button" onclick="window.close()" style="padding: 8px 16px; font-size: 14px; cursor: pointer; background: #e2e8f0; color: #0f172a; border: none; border-radius: 6px; margin-left: 8px;">
            Yopish
        </button>
        <div id="agentMsg" style="margin-top:10px;font-size:13px;color:#64748b;"></div>
    </div>

    <div class="receipt">
        <div class="center bold" style="margin-bottom: 4px; font-size: 16px;">ZAPCHASTLAR</div>
        <div class="center" style="font-size: 14px; margin-bottom: 4px;">{{ items|length }} ta</div>
        <div class="line"></div>

        {% for item in items %}
        <div class="item">
            <span class="checkbox"> </span>
            <span class="item-name">{% if item.phone_model %}{{ item.phone_model }} - {% elif item.repair_order %}{{ item.repair_order.phone_model }} - {% endif %}{{ item.name }}</span>
            {% if item.quantity > 1 %}<span class="qty">x{{ item.quantity }}</span>{% endif %}
        </div>
        {% empty %}
        <div class="center" style="padding: 10px 0;">Ro'yxat bo'sh</div>
        {% endfor %}

        <div class="line"></div>
    </div>

    <script>
    (function () {
        var btn = document.getElementById('btnAgentPrint');
        var btnLocal = document.getElementById('btnLocalPrint');
        var msg = document.getElementById('agentMsg');
        if (!btn) return;
        var csrf = '{{ csrf_token }}';
        var ids = new URLSearchParams(window.location.search).get('ids') || '';
        if (btnLocal) btnLocal.addEventListener('click', function () { window.print(); });
        btn.addEventListener('click', function () {
            btn.disabled = true;
            msg.textContent = 'Yuborilmoqda...';
            var body = new URLSearchParams();
            body.set('kind', 'zapchast');
            body.set('ids', ids);
            body.set('csrfmiddlewaretoken', csrf);
            fetch('{% url "repairs:receipt_print_queue" %}', {
                method: 'POST',
                headers: { 'X-CSRFToken': csrf, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString(),
                credentials: 'same-origin'
            })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j && j.ok) {
                    msg.style.color = '#15803d';
                    msg.textContent = 'Navbatga qo\'yildi #' + j.job_id + ' — XP-80 dan chiqadi';
                } else {
                    btn.disabled = false;
                    msg.style.color = '#b91c1c';
                    msg.textContent = (j && j.error) || 'Xato';
                }
            })
            .catch(function () {
                btn.disabled = false;
                msg.style.color = '#b91c1c';
                msg.textContent = 'Tarmoq xatosi';
            });
        });
    })();
    </script>
</body>
</html>

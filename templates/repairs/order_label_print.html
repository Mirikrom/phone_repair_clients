{% load repair_filters %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etiketka — {{ order.phone_model }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #e5e7eb;
            font-family: Arial, Helvetica, sans-serif;
            color: #0f172a;
        }
        .mode-modal, .result-card {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .55);
        }
        .mode-modal.hidden, .result-card.hidden, .preview-wrap.hidden { display: none !important; }
        .result-card { display: none; z-index: 10001; }
        .result-card.visible { display: flex; }
        .mode-card, .result-inner {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }
        .mode-card h1, .result-inner h2 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; }
        .mode-card p, .result-inner p { font-size: .88rem; color: #64748b; margin-bottom: 16px; line-height: 1.4; }
        .result-inner.ok h2 { color: #15803d; }
        .result-inner.err h2 { color: #b91c1c; }
        .mode-btns { display: flex; flex-direction: column; gap: 10px; }
        .mode-btn, .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }
        .mode-btn:disabled, .action-btn:disabled { opacity: .6; cursor: wait; }
        .mode-btn.oddiy { background: #e2e8f0; color: #0f172a; }
        .mode-btn.tuzalgan { background: #16a34a; color: #fff; }
        .mode-btn.tuzalmagan { background: #dc2626; color: #fff; }
        .action-btn.local { background: #2563eb; color: #fff; }
        .action-btn.agent { background: #16a34a; color: #fff; }
        .action-btn.back { background: #e2e8f0; color: #0f172a; }
        .mode-cancel, .linkish {
            margin-top: 12px;
            width: 100%;
            border: 0;
            background: transparent;
            color: #64748b;
            font-weight: 700;
            padding: 10px;
            cursor: pointer;
        }
        .preview-wrap {
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .preview-title {
            font-weight: 900;
            font-size: 1.05rem;
        }
        .preview-actions {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hint {
            font-size: .82rem;
            color: #64748b;
            text-align: center;
            max-width: 360px;
        }

        /* Preview + local print: 40x30 */
        .label {
            width: 40mm;
            height: 30mm;
            padding: 1.2mm 1.5mm;
            background: #fff;
            color: #000 !important;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
            display: flex;
            flex-direction: column;
            gap: 0.15mm;
        }
        .line {
            color: #000 !important;
            font-size: 9px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .line.model { font-size: 11px; }
        .line.money { font-size: 8px; }
        .line.status {
            font-size: 9px;
            display: flex;
            align-items: center;
            gap: 1.2mm;
            margin-top: 0.2mm;
        }
        .line.status .strike {
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
        }
        .line.dates {
            font-size: 7px;
            font-weight: 800;
            text-transform: none;
            margin-top: auto;
        }
        .mark-ok {
            display: inline-block;
            width: 2.8mm;
            height: 1.5mm;
            border-left: 1.4px solid #000;
            border-bottom: 1.4px solid #000;
            transform: rotate(-45deg);
            margin-bottom: 1mm;
        }
        .mark-bad {
            position: relative;
            display: inline-block;
            width: 3mm;
            height: 3mm;
        }
        .mark-bad::before, .mark-bad::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 1.4px;
            height: 3mm;
            background: #000;
        }
        .mark-bad::before { transform: translateX(-50%) rotate(45deg); }
        .mark-bad::after { transform: translateX(-50%) rotate(-45deg); }

        @page { size: 40mm 30mm; margin: 0; }
        @media print {
            html, body {
                width: 40mm !important;
                height: 30mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }
            .no-print, .mode-modal, .result-card, .preview-title, .preview-actions, .hint {
                display: none !important;
            }
            .preview-wrap {
                display: block !important;
                padding: 0 !important;
            }
            body * { visibility: hidden; }
            .label, .label * { visibility: visible !important; color: #000 !important; }
            .label {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="mode-modal" id="modeModal">
        <div class="mode-card">
            <h1>Etiketka turi</h1>
            <p>{{ order.phone_model }} — avval ko‘rib chiqing, keyin agent yoki lokal</p>
            <div class="mode-btns">
                <button type="button" class="mode-btn oddiy" data-mode="oddiy">Oddiy</button>
                <button type="button" class="mode-btn tuzalgan" data-mode="tuzalgan">Tuzalgan</button>
                <button type="button" class="mode-btn tuzalmagan" data-mode="tuzalmagan">Tuzalmagan</button>
            </div>
            <button type="button" class="mode-cancel" id="modeCancel">Yopish</button>
        </div>
    </div>

    <div class="preview-wrap hidden no-print" id="previewWrap">
        <div class="preview-title">Etiketka ko‘rinishi</div>
        <div class="label" id="label"></div>
        <p class="hint">Agent ishlasa — «Printerga yuborish». Agent buzilgan bo‘lsa — «Lokal pechat» (printerni o‘zingiz tanlaysiz).</p>
        <div class="preview-actions">
            <button type="button" class="action-btn local" id="btnLocal">Lokal pechat</button>
            <button type="button" class="action-btn agent" id="btnAgent">Printerga yuborish (agent / T361U)</button>
            <button type="button" class="action-btn back" id="btnBack">Orqaga</button>
        </div>
    </div>

    <!-- print uchun label previewWrap ichida -->

    <div class="result-card" id="resultCard">
        <div class="result-inner" id="resultInner">
            <h2 id="resultTitle"></h2>
            <p id="resultText"></p>
            <button type="button" id="resultClose">Yopish</button>
        </div>
    </div>

    <script>
    (function () {
        var order = {
            model: "{{ order.phone_model|escapejs }}",
            info: "{{ order.required_parts|default:''|escapejs }}",
            phone: "{{ order.client_phone|phone_digits|escapejs }}",
            name: "{{ order.client_name|default:''|escapejs }}",
            cost: "{% if order.repair_cost %}{{ order.repair_cost|money_dot_uz }}{% endif %}",
            deposit: "{% if order.deposit_amount %}{{ order.deposit_amount|money_dot_uz }}{% endif %}",
            createdAt: "{{ order.created_at|date:'d.m.Y H:i' }}"
        };
        var queueUrl = "{% url 'repairs:label_print_queue' order.pk %}";
        var csrfToken = "{{ csrf_token }}";
        var selectedMode = 'oddiy';
        var modal = document.getElementById('modeModal');
        var preview = document.getElementById('previewWrap');
        var label = document.getElementById('label');
        var resultCard = document.getElementById('resultCard');
        var resultInner = document.getElementById('resultInner');
        var resultTitle = document.getElementById('resultTitle');
        var resultText = document.getElementById('resultText');
        var busy = false;

        function pad(n) { return n < 10 ? '0' + n : String(n); }
        function formatNow(d) {
            return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(-2)
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function shortCreated() {
            var parts = (order.createdAt || '').split(' ');
            if (parts.length < 2) return order.createdAt;
            var d = parts[0].split('.');
            if (d.length === 3 && d[2].length === 4) {
                return d[0] + '.' + d[1] + '.' + d[2].slice(-2) + ' ' + parts[1];
            }
            return order.createdAt;
        }
        function esc(s) {
            return String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function buildLabel(mode) {
            var html = '';
            if (order.model) html += '<div class="line model">' + esc(order.model) + '</div>';
            if (order.info) html += '<div class="line info">' + esc(order.info) + '</div>';
            if (order.phone) html += '<div class="line">' + esc(order.phone) + '</div>';
            if (order.name) html += '<div class="line">' + esc(order.name) + '</div>';
            if (order.cost) html += '<div class="line money">Narxi:' + esc(order.cost) + '</div>';
            if (order.deposit) html += '<div class="line money">Berildi:' + esc(order.deposit) + '</div>';
            if (mode === 'tuzalgan') {
                html += '<div class="line status ok">TUZALGAN <span class="mark-ok"></span></div>';
                html += '<div class="line dates">' + esc(shortCreated()) + ' → ' + esc(formatNow(new Date())) + '</div>';
            } else if (mode === 'tuzalmagan') {
                html += '<div class="line status bad"><span class="strike">TUZALMAGAN</span> <span class="mark-bad"></span></div>';
                html += '<div class="line dates">' + esc(shortCreated()) + ' → ' + esc(formatNow(new Date())) + '</div>';
            } else {
                html += '<div class="line dates">' + esc(order.createdAt) + '</div>';
            }
            label.innerHTML = html;
        }
        function showPreview(mode) {
            selectedMode = mode;
            buildLabel(mode);
            modal.classList.add('hidden');
            preview.classList.remove('hidden');
        }
        function showResult(ok, title, text) {
            resultInner.className = 'result-inner ' + (ok ? 'ok' : 'err');
            resultTitle.textContent = title;
            resultText.textContent = text;
            resultCard.classList.add('visible');
            preview.classList.add('hidden');
            modal.classList.add('hidden');
        }
        function queuePrint() {
            if (busy) return;
            busy = true;
            document.getElementById('btnAgent').disabled = true;
            var body = new URLSearchParams();
            body.set('mode', selectedMode);
            body.set('csrfmiddlewaretoken', csrfToken);
            fetch(queueUrl, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString(),
                credentials: 'same-origin'
            })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                busy = false;
                document.getElementById('btnAgent').disabled = false;
                if (res.ok && res.j && res.j.ok) {
                    showResult(true, 'Navbatga qo\'yildi', 'Agent orqali T361U ga yuborildi. #' + res.j.job_id);
                } else {
                    showResult(false, 'Xato', (res.j && res.j.error) || 'Yuborib bo\'lmadi');
                }
            })
            .catch(function () {
                busy = false;
                document.getElementById('btnAgent').disabled = false;
                showResult(false, 'Xato', 'Tarmoq xatosi');
            });
        }

        document.querySelectorAll('.mode-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                showPreview(btn.getAttribute('data-mode'));
            });
        });
        document.getElementById('btnLocal').addEventListener('click', function () {
            buildLabel(selectedMode); // vaqt yangilansin
            window.print();
        });
        document.getElementById('btnAgent').addEventListener('click', queuePrint);
        document.getElementById('btnBack').addEventListener('click', function () {
            preview.classList.add('hidden');
            modal.classList.remove('hidden');
        });
        document.getElementById('modeCancel').addEventListener('click', function () {
            window.close();
            window.location.href = "{% url 'repairs:order_list' %}";
        });
        document.getElementById('resultClose').addEventListener('click', function () {
            window.close();
            window.location.href = "{% url 'repairs:order_list' %}";
        });
    })();
    </script>
</body>
</html>

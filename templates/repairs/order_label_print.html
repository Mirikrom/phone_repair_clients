{% load repair_filters %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etiketka — {{ order.phone_model }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #e5e7eb;
            font-family: Arial, Helvetica, sans-serif;
            color: #0f172a;
        }
        .mode-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .55);
        }
        .mode-modal.hidden { display: none !important; }
        .mode-card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }
        .mode-card h1 {
            font-size: 1.1rem;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .mode-card p {
            font-size: .88rem;
            color: #64748b;
            margin-bottom: 16px;
        }
        .mode-btns { display: flex; flex-direction: column; gap: 10px; }
        .mode-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }
        .mode-btn:disabled { opacity: .6; cursor: wait; }
        .mode-btn.oddiy { background: #e2e8f0; color: #0f172a; }
        .mode-btn.tuzalgan {
            background: #16a34a;
            color: #fff;
            box-shadow: 0 8px 18px rgba(22,163,74,.28);
        }
        .mode-btn.tuzalmagan {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 8px 18px rgba(220,38,38,.28);
        }
        .mode-cancel {
            margin-top: 12px;
            width: 100%;
            border: 0;
            background: transparent;
            color: #64748b;
            font-weight: 700;
            padding: 10px;
            cursor: pointer;
        }
        .result-card {
            display: none;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .45);
            z-index: 10001;
        }
        .result-card.visible { display: flex; }
        .result-inner {
            background: #fff;
            border-radius: 18px;
            padding: 22px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }
        .result-inner.ok h2 { color: #15803d; }
        .result-inner.err h2 { color: #b91c1c; }
        .result-inner h2 { font-size: 1.15rem; font-weight: 900; margin-bottom: 8px; }
        .result-inner p { color: #64748b; font-size: .92rem; line-height: 1.4; margin-bottom: 16px; }
        .result-inner button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 800;
            cursor: pointer;
            background: #3f66ff;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="mode-modal" id="modeModal">
        <div class="mode-card">
            <h1>Etiketka turi</h1>
            <p>{{ order.phone_model }} — PC dagi printerga yuborilsin</p>
            <div class="mode-btns">
                <button type="button" class="mode-btn oddiy" data-mode="oddiy">Oddiy</button>
                <button type="button" class="mode-btn tuzalgan" data-mode="tuzalgan">Tuzalgan</button>
                <button type="button" class="mode-btn tuzalmagan" data-mode="tuzalmagan">Tuzalmagan</button>
            </div>
            <button type="button" class="mode-cancel" id="modeCancel">Yopish</button>
        </div>
    </div>

    <div class="result-card" id="resultCard">
        <div class="result-inner" id="resultInner">
            <h2 id="resultTitle"></h2>
            <p id="resultText"></p>
            <button type="button" id="resultClose">Yopish</button>
        </div>
    </div>

    <script>
    (function () {
        var queueUrl = "{% url 'repairs:label_print_queue' order.pk %}";
        var csrfToken = "{{ csrf_token }}";
        var modal = document.getElementById('modeModal');
        var resultCard = document.getElementById('resultCard');
        var resultInner = document.getElementById('resultInner');
        var resultTitle = document.getElementById('resultTitle');
        var resultText = document.getElementById('resultText');
        var busy = false;

        function showResult(ok, title, text) {
            resultInner.className = 'result-inner ' + (ok ? 'ok' : 'err');
            resultTitle.textContent = title;
            resultText.textContent = text;
            resultCard.classList.add('visible');
            modal.classList.add('hidden');
        }

        function setBusy(on) {
            busy = on;
            document.querySelectorAll('.mode-btn').forEach(function (b) {
                b.disabled = on;
            });
        }

        function queuePrint(mode) {
            if (busy) return;
            setBusy(true);
            var body = new URLSearchParams();
            body.set('mode', mode);
            body.set('csrfmiddlewaretoken', csrfToken);

            fetch(queueUrl, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: body.toString(),
                credentials: 'same-origin'
            })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                setBusy(false);
                if (res.ok && res.j && res.j.ok) {
                    showResult(
                        true,
                        'Navbatga qo\'yildi',
                        'Etiketka PC dagi printerga yuborildi. Agent ishlab tursa bir necha soniyada chiqadi. #' + res.j.job_id
                    );
                } else {
                    showResult(false, 'Xato', (res.j && res.j.error) || 'Yuborib bo\'lmadi');
                }
            })
            .catch(function () {
                setBusy(false);
                showResult(false, 'Xato', 'Tarmoq xatosi. Qayta urinib ko\'ring.');
            });
        }

        document.querySelectorAll('.mode-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                queuePrint(btn.getAttribute('data-mode'));
            });
        });

        document.getElementById('modeCancel').addEventListener('click', function () {
            window.close();
            window.location.href = "{% url 'repairs:order_list' %}";
        });

        document.getElementById('resultClose').addEventListener('click', function () {
            window.close();
            window.location.href = "{% url 'repairs:order_list' %}";
        });
    })();
    </script>
</body>
</html>

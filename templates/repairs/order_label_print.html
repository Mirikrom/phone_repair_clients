{% load repair_filters %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etiketka — {{ order.phone_model }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #e5e7eb;
            font-family: Arial, Helvetica, sans-serif;
            color: #0f172a;
        }
        .mode-modal, .result-card {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .55);
        }
        .mode-modal.hidden, .result-card.hidden, .preview-wrap.hidden { display: none !important; }
        .result-card { display: none; z-index: 10001; }
        .result-card.visible { display: flex; }
        .mode-card, .result-inner {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
        }
        .mode-card h1, .result-inner h2 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; }
        .mode-card p, .result-inner p { font-size: .88rem; color: #64748b; margin-bottom: 14px; line-height: 1.4; }
        .result-inner.ok h2 { color: #15803d; }
        .result-inner.err h2 { color: #b91c1c; }
        .lines-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .line-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .line-row input {
            flex: 1;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: .95rem;
            font-weight: 700;
        }
        .line-row input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.15);
        }
        .line-row .btn-remove {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
        }
        .btn-add {
            width: 100%;
            min-height: 42px;
            border: 1.5px dashed #94a3b8;
            border-radius: 10px;
            background: #f8fafc;
            color: #334155;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-add:hover { background: #e2e8f0; }
        .mode-btns { display: flex; flex-direction: column; gap: 10px; }
        .mode-btn, .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }
        .mode-btn:disabled, .action-btn:disabled { opacity: .6; cursor: wait; }
        .mode-btn.next { background: #2563eb; color: #fff; }
        .mode-btn.oddiy { background: #e2e8f0; color: #0f172a; }
        .mode-btn.tuzalgan { background: #16a34a; color: #fff; }
        .mode-btn.tuzalmagan { background: #dc2626; color: #fff; }
        .action-btn.local { background: #2563eb; color: #fff; }
        .action-btn.agent { background: #16a34a; color: #fff; }
        .action-btn.back { background: #e2e8f0; color: #0f172a; }
        .mode-cancel, .linkish {
            margin-top: 12px;
            width: 100%;
            border: 0;
            background: transparent;
            color: #64748b;
            font-weight: 700;
            padding: 10px;
            cursor: pointer;
        }
        .preview-wrap {
            padding: 24px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .preview-title {
            font-weight: 900;
            font-size: 1.05rem;
        }
        .preview-actions {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .label {
            width: 40mm;
            height: 30mm;
            padding: 1.2mm 1.5mm;
            background: #fff;
            color: #000 !important;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
            display: flex;
            flex-direction: column;
            gap: 0.15mm;
        }
        .line {
            color: #000 !important;
            font-size: 9px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .line.model { font-size: 11px; }
        .line.money { font-size: 8px; }
        .line.status {
            font-size: 9px;
            display: flex;
            align-items: center;
            gap: 1.2mm;
            margin-top: 0.2mm;
        }
        .line.status .strike {
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
        }
        .line.dates {
            font-size: 7px;
            font-weight: 800;
            text-transform: none;
            margin-top: auto;
        }
        .mark-ok {
            display: inline-block;
            width: 2.8mm;
            height: 1.5mm;
            border-left: 1.4px solid #000;
            border-bottom: 1.4px solid #000;
            transform: rotate(-45deg);
            margin-bottom: 1mm;
        }
        .mark-bad {
            position: relative;
            display: inline-block;
            width: 3mm;
            height: 3mm;
        }
        .mark-bad::before, .mark-bad::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 1.4px;
            height: 3mm;
            background: #000;
        }
        .mark-bad::before { transform: translateX(-50%) rotate(45deg); }
        .mark-bad::after { transform: translateX(-50%) rotate(-45deg); }

        @page { size: 40mm 30mm; margin: 0; }
        @media print {
            html, body {
                width: 40mm !important;
                height: 30mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }
            .no-print, .mode-modal, .result-card, .preview-title, .preview-actions, .hint {
                display: none !important;
            }
            .preview-wrap {
                display: block !important;
                padding: 0 !important;
            }
            body * { visibility: hidden; }
            .label, .label * { visibility: visible !important; color: #000 !important; }
            .label {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="mode-modal" id="linesModal">
        <div class="mode-card">
            <h1>Etiketka matni</h1>
            <p>To‘ldirilgan qatorlar. Kerak bo‘lsa o‘zgartiring yoki yangi qator qo‘shing.</p>
            <div class="lines-list" id="linesList"></div>
            <button type="button" class="btn-add" id="btnAddLine">+ Qator qo‘shish</button>
            <button type="button" class="mode-btn next" id="btnLinesNext">Davom etish</button>
            <button type="button" class="mode-cancel" id="linesCancel">Yopish</button>
        </div>
    </div>

    <div class="mode-modal hidden" id="modeModal">
        <div class="mode-card">
            <h1>Etiketka turi</h1>
            <p>{{ order.phone_model }}</p>
            <div class="mode-btns">
                <button type="button" class="mode-btn oddiy" data-mode="oddiy">Oddiy</button>
                <button type="button" class="mode-btn tuzalgan" data-mode="tuzalgan">Tuzalgan</button>
                <button type="button" class="mode-btn tuzalmagan" data-mode="tuzalmagan">Tuzalmagan</button>
            </div>
            <button type="button" class="mode-cancel" id="modeBack">Orqaga</button>
        </div>
    </div>

    <div class="preview-wrap hidden no-print" id="previewWrap">
        <div class="preview-title">Etiketka ko‘rinishi</div>
        <div class="label" id="label"></div>
        <div class="preview-actions">
            <button type="button" class="action-btn local" id="btnLocal">Lokal pechat</button>
            <button type="button" class="action-btn agent" id="btnAgent">Printerga yuborish (agent / T361U)</button>
            <button type="button" class="action-btn back" id="btnBack">Orqaga</button>
        </div>
    </div>

    <div class="result-card" id="resultCard">
        <div class="result-inner" id="resultInner">
            <h2 id="resultTitle"></h2>
            <p id="resultText"></p>
            <button type="button" id="resultClose">Yopish</button>
        </div>
    </div>

    <script>
    (function () {
        var order = {
            model: "{{ order.phone_model|escapejs }}",
            info: "{{ order.required_parts|default:''|escapejs }}",
            phone: "{{ order.client_phone|phone_digits|escapejs }}",
            name: "{{ order.client_name|default:''|escapejs }}",
            cost: "{% if order.repair_cost %}{{ order.repair_cost|money_dot_uz }}{% endif %}",
            deposit: "{% if order.deposit_amount %}{{ order.deposit_amount|money_dot_uz }}{% endif %}",
            createdAt: "{{ order.created_at|date:'d.m.Y H:i' }}"
        };
        var queueUrl = "{% url 'repairs:label_print_queue' order.pk %}";
        var markUrl = "{% url 'repairs:order_set_label_print_mark' order.pk %}";
        var csrfToken = "{{ csrf_token }}";
        var selectedMode = 'oddiy';
        var MAX_LINES = 12;
        var linesModal = document.getElementById('linesModal');
        var modeModal = document.getElementById('modeModal');
        var preview = document.getElementById('previewWrap');
        var linesList = document.getElementById('linesList');
        var label = document.getElementById('label');
        var resultCard = document.getElementById('resultCard');
        var resultInner = document.getElementById('resultInner');
        var resultTitle = document.getElementById('resultTitle');
        var resultText = document.getElementById('resultText');
        var busy = false;

        function pad(n) { return n < 10 ? '0' + n : String(n); }
        function formatNow(d) {
            return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(-2)
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function shortCreated() {
            var parts = (order.createdAt || '').split(' ');
            if (parts.length < 2) return order.createdAt;
            var d = parts[0].split('.');
            if (d.length === 3 && d[2].length === 4) {
                return d[0] + '.' + d[1] + '.' + d[2].slice(-2) + ' ' + parts[1];
            }
            return order.createdAt;
        }
        function esc(s) {
            return String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function defaultLines() {
            var lines = [];
            if (order.model) lines.push(order.model);
            if (order.info) lines.push(order.info);
            if (order.phone) lines.push(order.phone);
            if (order.name) lines.push(order.name);
            if (order.cost) lines.push('Narxi:' + order.cost);
            if (order.deposit) lines.push('Berildi:' + order.deposit);
            return lines;
        }
        function addLineRow(value) {
            if (linesList.children.length >= MAX_LINES) return;
            var row = document.createElement('div');
            row.className = 'line-row';
            var input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 120;
            input.value = value || '';
            input.placeholder = 'Matn...';
            var remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'btn-remove';
            remove.title = "O'chirish";
            remove.textContent = '×';
            remove.addEventListener('click', function () {
                row.remove();
            });
            row.appendChild(input);
            row.appendChild(remove);
            linesList.appendChild(row);
            if (!value) input.focus();
        }
        function getLines() {
            var lines = [];
            linesList.querySelectorAll('input').forEach(function (inp) {
                var v = (inp.value || '').trim();
                if (v) lines.push(v);
            });
            return lines;
        }
        function buildLabel(mode) {
            var lines = getLines();
            var html = '';
            lines.forEach(function (t, idx) {
                var cls = 'line';
                if (idx === 0) cls += ' model';
                if (/^Narxi:|^Berildi:/i.test(t)) cls += ' money';
                html += '<div class="' + cls + '">' + esc(t) + '</div>';
            });
            if (mode === 'tuzalgan') {
                html += '<div class="line status ok">TUZALGAN <span class="mark-ok"></span></div>';
                html += '<div class="line dates">' + esc(shortCreated()) + ' → ' + esc(formatNow(new Date())) + '</div>';
            } else if (mode === 'tuzalmagan') {
                html += '<div class="line status bad"><span class="strike">TUZALMAGAN</span> <span class="mark-bad"></span></div>';
                html += '<div class="line dates">' + esc(shortCreated()) + ' → ' + esc(formatNow(new Date())) + '</div>';
            } else {
                html += '<div class="line dates">' + esc(order.createdAt) + '</div>';
            }
            label.innerHTML = html;
        }
        function showPreview(mode) {
            selectedMode = mode;
            buildLabel(mode);
            modeModal.classList.add('hidden');
            linesModal.classList.add('hidden');
            preview.classList.remove('hidden');
        }
        function showResult(ok, title, text) {
            resultInner.className = 'result-inner ' + (ok ? 'ok' : 'err');
            resultTitle.textContent = title;
            resultText.textContent = text;
            resultCard.classList.add('visible');
            preview.classList.add('hidden');
            modeModal.classList.add('hidden');
            linesModal.classList.add('hidden');
        }
        function setPrintMark(mode) {
            var body = new URLSearchParams();
            body.set('mode', mode);
            body.set('csrfmiddlewaretoken', csrfToken);
            return fetch(markUrl, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: body.toString(),
                credentials: 'same-origin'
            }).catch(function () {});
        }
        function queuePrint() {
            if (busy) return;
            var lines = getLines();
            if (!lines.length) {
                alert("Kamida 1 ta qator to'ldiring");
                return;
            }
            busy = true;
            document.getElementById('btnAgent').disabled = true;
            var body = new URLSearchParams();
            body.set('mode', selectedMode);
            body.set('csrfmiddlewaretoken', csrfToken);
            lines.forEach(function (t, i) {
                body.set('line' + (i + 1), t);
            });
            body.set('lines_count', String(lines.length));
            fetch(queueUrl, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString(),
                credentials: 'same-origin'
            })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                busy = false;
                document.getElementById('btnAgent').disabled = false;
                if (res.ok && res.j && res.j.ok) {
                    goBackList();
                } else {
                    showResult(false, 'Xato', (res.j && res.j.error) || 'Yuborib bo\'lmadi');
                }
            })
            .catch(function () {
                busy = false;
                document.getElementById('btnAgent').disabled = false;
                showResult(false, 'Xato', 'Tarmoq xatosi');
            });
        }
        function goBackList() {
            window.location.href = "{% url 'repairs:order_list' %}";
        }
        function afterPrintGoHome() {
            // pechat dialog yopilgach asosiy ekranga
            var done = false;
            function go() {
                if (done) return;
                done = true;
                goBackList();
            }
            window.addEventListener('afterprint', go, { once: true });
            setTimeout(go, 800);
        }

        defaultLines().forEach(function (t) { addLineRow(t); });
        if (!linesList.children.length) addLineRow('');

        document.getElementById('btnAddLine').addEventListener('click', function () {
            if (linesList.children.length >= MAX_LINES) {
                alert('Maksimum ' + MAX_LINES + ' qator');
                return;
            }
            addLineRow('');
        });
        document.getElementById('btnLinesNext').addEventListener('click', function () {
            if (!getLines().length) {
                alert("Kamida 1 ta qator to'ldiring");
                return;
            }
            linesModal.classList.add('hidden');
            modeModal.classList.remove('hidden');
        });
        document.getElementById('linesCancel').addEventListener('click', goBackList);
        document.getElementById('modeBack').addEventListener('click', function () {
            modeModal.classList.add('hidden');
            linesModal.classList.remove('hidden');
        });
        document.querySelectorAll('#modeModal .mode-btn[data-mode]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                showPreview(btn.getAttribute('data-mode'));
            });
        });
        document.getElementById('btnLocal').addEventListener('click', function () {
            buildLabel(selectedMode);
            setPrintMark(selectedMode);
            afterPrintGoHome();
            window.print();
        });
        document.getElementById('btnAgent').addEventListener('click', queuePrint);
        document.getElementById('btnBack').addEventListener('click', function () {
            preview.classList.add('hidden');
            modeModal.classList.remove('hidden');
        });
        document.getElementById('resultClose').addEventListener('click', goBackList);
    })();
    </script>
</body>
</html>

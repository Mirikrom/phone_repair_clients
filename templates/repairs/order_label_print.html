{% load repair_filters %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etiketka — {{ order.phone_model }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #e5e7eb;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
        }

        /* Modal tanlov */
        .mode-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .55);
        }
        .mode-modal.hidden { display: none !important; }
        .mode-card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }
        .mode-card h1 {
            font-size: 1.1rem;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .mode-card p {
            font-size: .88rem;
            color: #64748b;
            margin-bottom: 16px;
        }
        .mode-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s;
        }
        .mode-btn:hover { transform: translateY(-1px); }
        .mode-btn:active { transform: scale(.98); }
        .mode-btn.oddiy {
            background: #e2e8f0;
            color: #0f172a;
        }
        .mode-btn.tuzalgan {
            background: #16a34a;
            color: #fff;
            box-shadow: 0 8px 18px rgba(22,163,74,.28);
        }
        .mode-btn.tuzalmagan {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 8px 18px rgba(220,38,38,.28);
        }
        .mode-cancel {
            margin-top: 12px;
            width: 100%;
            border: 0;
            background: transparent;
            color: #64748b;
            font-weight: 700;
            padding: 10px;
            cursor: pointer;
        }

        .toolbar {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }
        .toolbar.hidden { display: none !important; }
        .toolbar button {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 700;
        }
        .btn-print { background: #2563eb; color: #fff; }
        .btn-back { background: #e2e8f0; color: #0f172a; }
        .btn-close { background: #e2e8f0; color: #0f172a; }

        .preview-wrap {
            display: none;
            padding: 72px 16px 24px;
            justify-content: center;
        }
        .preview-wrap.visible { display: flex; }

        /* 40×30 mm etiketka */
        .label {
            width: 40mm;
            height: 30mm;
            padding: 1.2mm 1.5mm 1.2mm;
            background: #fff;
            color: #000 !important;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 0.15mm;
        }

        .line {
            color: #000 !important;
            font-size: 9px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .line.model { font-size: 11px; }
        .line.info { font-size: 9px; }
        .line.money { font-size: 8px; letter-spacing: -0.02em; }
        .line.status {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.02em;
            margin-top: 0.2mm;
            display: flex;
            align-items: center;
            gap: 1.2mm;
        }
        .line.status .strike {
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
        }
        /* Termal printer uchun CSS galochka / X */
        .mark-ok {
            display: inline-block;
            width: 2.8mm;
            height: 1.5mm;
            border-left: 1.4px solid #000;
            border-bottom: 1.4px solid #000;
            transform: rotate(-45deg);
            margin-bottom: 1mm;
            flex-shrink: 0;
        }
        .mark-bad {
            position: relative;
            display: inline-block;
            width: 3mm;
            height: 3mm;
            flex-shrink: 0;
        }
        .mark-bad::before,
        .mark-bad::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            width: 1.4px;
            height: 3mm;
            background: #000;
        }
        .mark-bad::before { transform: translateX(-50%) rotate(45deg); }
        .mark-bad::after { transform: translateX(-50%) rotate(-45deg); }
        .line.dates {
            font-size: 7px;
            font-weight: 800;
            text-transform: none;
            letter-spacing: -0.03em;
            margin-top: auto;
            white-space: nowrap;
        }
        .line.dates .sep { margin: 0 0.5mm; font-weight: 700; }

        .label-time {
            position: absolute;
            right: 1.3mm;
            bottom: 0.8mm;
            color: #000 !important;
            font-size: 8px;
            font-weight: 800;
            line-height: 1;
            text-transform: none;
        }

        @page {
            size: 40mm 30mm;
            margin: 0;
        }

        @media print {
            html, body {
                width: 40mm !important;
                height: 30mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                overflow: hidden !important;
            }

            .mode-modal,
            .toolbar { display: none !important; }

            .preview-wrap {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            body * { visibility: hidden; }
            .label,
            .label * {
                visibility: visible !important;
                color: #000 !important;
            }

            .label {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                width: 40mm !important;
                height: 30mm !important;
                padding: 1.2mm 1.5mm 1.2mm !important;
                box-shadow: none !important;
                background: #fff !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
    <div class="mode-modal" id="modeModal">
        <div class="mode-card">
            <h1>Etiketka turi</h1>
            <p>{{ order.phone_model }} — qanday chop etilsin?</p>
            <div class="mode-btns">
                <button type="button" class="mode-btn oddiy" data-mode="oddiy">Oddiy</button>
                <button type="button" class="mode-btn tuzalgan" data-mode="tuzalgan">Tuzalgan</button>
                <button type="button" class="mode-btn tuzalmagan" data-mode="tuzalmagan">Tuzalmagan</button>
            </div>
            <button type="button" class="mode-cancel" id="modeCancel">Yopish</button>
        </div>
    </div>

    <div class="toolbar hidden" id="toolbar">
        <button type="button" class="btn-back" id="btnBack">Orqaga</button>
        <button type="button" class="btn-print" id="btnPrint">Pechat</button>
        <button type="button" class="btn-close" onclick="window.close()">Yopish</button>
    </div>

    <div class="preview-wrap" id="previewWrap">
        <div class="label" id="label"></div>
    </div>

    <script>
    (function () {
        var order = {
            model: "{{ order.phone_model|escapejs }}",
            info: "{{ order.required_parts|default:''|escapejs }}",
            phone: "{{ order.client_phone|phone_digits|escapejs }}",
            name: "{{ order.client_name|default:''|escapejs }}",
            cost: "{% if order.repair_cost %}{{ order.repair_cost|money_dot_uz }}{% endif %}",
            deposit: "{% if order.deposit_amount %}{{ order.deposit_amount|money_dot_uz }}{% endif %}",
            createdAt: "{{ order.created_at|date:'d.m.Y H:i' }}"
        };

        var modal = document.getElementById('modeModal');
        var toolbar = document.getElementById('toolbar');
        var preview = document.getElementById('previewWrap');
        var label = document.getElementById('label');

        function pad(n) { return n < 10 ? '0' + n : String(n); }
        function formatNow(d) {
            return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + String(d.getFullYear()).slice(-2)
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function shortCreated() {
            // 09.09.2026 10:33 -> 09.09.26 10:33
            var parts = (order.createdAt || '').split(' ');
            if (parts.length < 2) return order.createdAt;
            var d = parts[0].split('.');
            if (d.length === 3 && d[2].length === 4) {
                return d[0] + '.' + d[1] + '.' + d[2].slice(-2) + ' ' + parts[1];
            }
            return order.createdAt;
        }

        function esc(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function buildLabel(mode) {
            var html = '';
            if (order.model) html += '<div class="line model">' + esc(order.model) + '</div>';
            if (order.info) html += '<div class="line info">' + esc(order.info) + '</div>';
            if (order.phone) html += '<div class="line">' + esc(order.phone) + '</div>';
            if (order.name) html += '<div class="line">' + esc(order.name) + '</div>';
            if (order.cost) html += '<div class="line money">Narxi:' + esc(order.cost) + '</div>';
            if (order.deposit) html += '<div class="line money">Berildi:' + esc(order.deposit) + '</div>';

            if (mode === 'tuzalgan') {
                html += '<div class="line status ok">TUZALGAN <span class="mark-ok" aria-hidden="true"></span></div>';
                html += '<div class="line dates">' + esc(shortCreated())
                    + '<span class="sep">→</span>' + esc(formatNow(new Date())) + '</div>';
            } else if (mode === 'tuzalmagan') {
                html += '<div class="line status bad"><span class="strike">TUZALMAGAN</span> <span class="mark-bad" aria-hidden="true"></span></div>';
                html += '<div class="line dates">' + esc(shortCreated())
                    + '<span class="sep">→</span>' + esc(formatNow(new Date())) + '</div>';
            } else {
                html += '<div class="line dates">' + esc(order.createdAt) + '</div>';
            }

            label.innerHTML = html;
        }

        function showLabel(mode) {
            buildLabel(mode);
            modal.classList.add('hidden');
            toolbar.classList.remove('hidden');
            preview.classList.add('visible');
            setTimeout(function () { window.print(); }, 250);
        }

        document.querySelectorAll('.mode-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                showLabel(btn.getAttribute('data-mode'));
            });
        });

        document.getElementById('modeCancel').addEventListener('click', function () {
            window.close();
        });

        document.getElementById('btnBack').addEventListener('click', function () {
            toolbar.classList.add('hidden');
            preview.classList.remove('visible');
            modal.classList.remove('hidden');
            label.innerHTML = '';
        });

        document.getElementById('btnPrint').addEventListener('click', function () {
            window.print();
        });
    })();
    </script>
</body>
</html>

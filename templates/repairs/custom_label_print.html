<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erkin etiketka — Sozlamalar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #eef2ff;
            font-family: Arial, Helvetica, sans-serif;
            color: #0f172a;
            padding: 20px 14px 40px;
        }
        .shell {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 18px;
            box-shadow: 0 14px 40px rgba(2,6,23,.08);
        }
        h1 { font-size: 1.15rem; font-weight: 900; margin-bottom: 4px; }
        .sub { font-size: .88rem; color: #64748b; margin-bottom: 16px; line-height: 1.4; }
        .field { margin-bottom: 10px; }
        .field label {
            display: block;
            font-size: .78rem;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 1rem;
            font-weight: 700;
        }
        .field input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.15);
        }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }
        .action-btn:disabled { opacity: .6; cursor: wait; }
        .action-btn.preview { background: #e2e8f0; color: #0f172a; }
        .action-btn.local { background: #2563eb; color: #fff; }
        .action-btn.agent { background: #16a34a; color: #fff; }
        .action-btn.back { background: transparent; color: #64748b; }
        .preview-wrap.hidden, .form-wrap.hidden, .result-card.hidden { display: none !important; }
        .preview-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }
        .preview-title { font-weight: 900; font-size: 1.05rem; }
        .label {
            width: 40mm;
            height: 30mm;
            padding: 1.2mm 1.5mm;
            background: #fff;
            color: #000 !important;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
            display: flex;
            flex-direction: column;
            gap: 0.15mm;
        }
        .line {
            color: #000 !important;
            font-size: 9px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .line.dates {
            font-size: 7px;
            font-weight: 800;
            text-transform: none;
            margin-top: auto;
        }
        .result-card {
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, .55);
        }
        .result-card.visible { display: flex; }
        .result-inner {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 18px;
            padding: 20px 18px 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }
        .result-inner.ok h2 { color: #15803d; }
        .result-inner.err h2 { color: #b91c1c; }
        .result-inner h2 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; }
        .result-inner p { font-size: .88rem; color: #64748b; margin-bottom: 16px; line-height: 1.4; }
        .result-inner button {
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            background: #e2e8f0;
            font-weight: 800;
            cursor: pointer;
        }
        @page { size: 40mm 30mm; margin: 0; }
        @media print {
            html, body {
                width: 40mm !important;
                height: 30mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }
            .no-print, .shell > *:not(.preview-wrap), .preview-title, .preview-actions, .result-card {
                display: none !important;
            }
            .shell { box-shadow: none !important; padding: 0 !important; max-width: none !important; }
            .preview-wrap { display: block !important; padding: 0 !important; }
            body * { visibility: hidden; }
            .label, .label * { visibility: visible !important; color: #000 !important; }
            .label {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="form-wrap no-print" id="formWrap">
            <h1><i class="bi bi-gear me-1"></i> Erkin etiketka</h1>
            <p class="sub">7 ta qatorga o‘zingiz yozing. Bo‘sh qatorlar chiqmaydi. Oxiriga chop etilgan sana/vaqt qo‘shiladi.</p>
            {% for i in "1234567" %}
            <div class="field">
                <label for="line{{ forloop.counter }}">Qator {{ forloop.counter }}</label>
                <input type="text" id="line{{ forloop.counter }}" name="line{{ forloop.counter }}" maxlength="120" autocomplete="off">
            </div>
            {% endfor %}
            <div class="actions">
                <button type="button" class="action-btn preview" id="btnPreview">Ko‘rinish / Pechat</button>
                <a href="{% url 'repairs:order_list' %}" class="action-btn back text-decoration-none">Orqaga</a>
            </div>
        </div>

        <div class="preview-wrap hidden" id="previewWrap">
            <div class="preview-title no-print">Etiketka ko‘rinishi</div>
            <div class="label" id="label"></div>
            <div class="actions preview-actions no-print" style="width:100%">
                <button type="button" class="action-btn local" id="btnLocal">Lokal pechat</button>
                <button type="button" class="action-btn agent" id="btnAgent">Printerga yuborish (agent / T361U)</button>
                <button type="button" class="action-btn back" id="btnBack">Orqaga</button>
            </div>
        </div>
    </div>

    <div class="result-card" id="resultCard">
        <div class="result-inner" id="resultInner">
            <h2 id="resultTitle"></h2>
            <p id="resultText"></p>
            <button type="button" id="resultClose">Yopish</button>
        </div>
    </div>

    <script>
    (function () {
        var queueUrl = "{% url 'repairs:custom_label_queue' %}";
        var csrfToken = "{{ csrf_token }}";
        var formWrap = document.getElementById('formWrap');
        var preview = document.getElementById('previewWrap');
        var label = document.getElementById('label');
        var resultCard = document.getElementById('resultCard');
        var resultInner = document.getElementById('resultInner');
        var resultTitle = document.getElementById('resultTitle');
        var resultText = document.getElementById('resultText');
        var busy = false;

        function pad(n) { return n < 10 ? '0' + n : String(n); }
        function formatNow(d) {
            return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear()
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function esc(s) {
            return String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function getLines() {
            var lines = [];
            for (var i = 1; i <= 7; i++) {
                var v = (document.getElementById('line' + i).value || '').trim();
                if (v) lines.push(v);
            }
            return lines;
        }
        function buildLabel() {
            var lines = getLines();
            var html = '';
            lines.forEach(function (t) {
                html += '<div class="line">' + esc(t) + '</div>';
            });
            html += '<div class="line dates">' + esc(formatNow(new Date())) + '</div>';
            label.innerHTML = html;
            return lines;
        }
        function showResult(ok, title, text) {
            resultInner.className = 'result-inner ' + (ok ? 'ok' : 'err');
            resultTitle.textContent = title;
            resultText.textContent = text;
            resultCard.classList.add('visible');
        }

        document.getElementById('btnPreview').addEventListener('click', function () {
            var lines = getLines();
            if (!lines.length) {
                alert("Kamida 1 ta qator to'ldiring");
                return;
            }
            buildLabel();
            formWrap.classList.add('hidden');
            preview.classList.remove('hidden');
        });
        document.getElementById('btnBack').addEventListener('click', function () {
            preview.classList.add('hidden');
            formWrap.classList.remove('hidden');
        });
        document.getElementById('btnLocal').addEventListener('click', function () {
            buildLabel();
            window.print();
        });
        document.getElementById('btnAgent').addEventListener('click', function () {
            var lines = getLines();
            if (!lines.length || busy) return;
            busy = true;
            document.getElementById('btnAgent').disabled = true;
            var body = new URLSearchParams();
            body.set('csrfmiddlewaretoken', csrfToken);
            for (var i = 1; i <= 7; i++) {
                body.set('line' + i, document.getElementById('line' + i).value || '');
            }
            fetch(queueUrl, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrfToken, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString(),
                credentials: 'same-origin'
            })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
                busy = false;
                document.getElementById('btnAgent').disabled = false;
                if (res.ok && res.j && res.j.ok) {
                    showResult(true, "Navbatga qo'yildi", 'Agent orqali T361U ga yuborildi. #' + res.j.job_id);
                } else {
                    showResult(false, 'Xato', (res.j && res.j.error) || "Yuborib bo'lmadi");
                }
            })
            .catch(function () {
                busy = false;
                document.getElementById('btnAgent').disabled = false;
                showResult(false, 'Xato', 'Tarmoq xatosi');
            });
        });
        document.getElementById('resultClose').addEventListener('click', function () {
            resultCard.classList.remove('visible');
        });
    })();
    </script>
</body>
</html>

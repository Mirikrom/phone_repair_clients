{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=80mm">
  <title>Vizitka - МИРКОМИЛ</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @page { size: 80mm auto; margin: 0mm; }

    body{
      width: 80mm;
      max-width: 80mm;
      margin: 0;
      padding: 0;
      background: #fff;
      font-weight: 600;
      line-height: 1.2;
    }

    .wrap{
      padding: 2mm;
    }

    .vizitka{
      border: 8px double #000;
      padding: 3mm 3mm 4mm 3mm;
      text-align: center;
    }

    .name{
      font-size: 30px;
      font-weight: 800;
      margin: 1mm 0;
    }

    .phone{
      font-size: 28px;
      letter-spacing: 0.5px;
      margin-bottom: 2mm;
    }

    /* ===== LOGO + QR YONMA-YON ===== */
    .brand-row{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2mm;
      margin: 3mm 0;
    }

    .brand-row .logo img{
      max-width: 30mm;          /* logo kichkina */
      height: auto;
      display: block;
    }

    .brand-row .qr img{
      width: 32mm;              /* QR kichkina, lekin o‘qiladi */
      height: 32mm;
      display: block;
      image-rendering: pixelated;
    }

    .tg-text{
      font-size: 16px;
      margin-top: 2mm;
      line-height: 1.3;
    }

    .tg{
      font-size: 20px;
      font-weight: 800;
      margin-top: 1mm;
    }

    /* browserdagi tugma */
    .no-print{
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
    }

    @media print{
      .no-print{ display:none !important; }
      body{
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      a{ color:#000; text-decoration:none; }
    }
  </style>
</head>

<body>

  <div class="no-print">
    <button type="button" id="btnAgentPrint"
      style="padding:8px 16px;font-size:14px;cursor:pointer;background:#16a34a;color:#fff;border:none;border-radius:6px;font-weight:700;">
      Printerga yuborish (XP-80)
    </button>
    <button type="button" onclick="window.close()"
      style="padding:8px 16px;font-size:14px;cursor:pointer;background:#e2e8f0;color:#0f172a;border:none;border-radius:6px;margin-left:8px;">
      Yopish
    </button>
    <div id="agentMsg" style="margin-top:10px;font-size:13px;color:#64748b;"></div>
  </div>

  <div class="wrap">
    <div class="vizitka">

      <!-- ASOSIY MA'LUMOT -->
      <div class="name">МИРКОМИЛ</div>
      <div class="phone">90 328-33-13</div>

      <!-- LOGO + QR YONMA-YON -->
      <div class="brand-row">
        <div class="logo">
          <img src="{% static 'img/nfix_logo.png' %}" alt="NFIX logo">
        </div>

        <div class="qr">
          <img src="{% static 'img/nfix_telegram_qr.png' %}" alt="Telegram QR">
        </div>
      </div>

      <!-- TELEGRAM MATN -->
      <div class="tg-text">
        Bizning telegram kanalga obuna bo‘lishni unutmang!
      </div>
      <div class="tg">
        @NFIX_SERVICE
      </div>

    </div>
  </div>

  <script>
  (function () {
    var btn = document.getElementById('btnAgentPrint');
    var msg = document.getElementById('agentMsg');
    var csrf = '{{ csrf_token }}';
    btn.addEventListener('click', function () {
      btn.disabled = true;
      msg.textContent = 'Yuborilmoqda...';
      var body = new URLSearchParams();
      body.set('kind', 'vizitka');
      body.set('csrfmiddlewaretoken', csrf);
      fetch('{% url "repairs:receipt_print_queue" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': csrf, 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
        credentials: 'same-origin'
      })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) {
          msg.style.color = '#15803d';
          msg.textContent = 'Navbatga qo\'yildi #' + j.job_id + ' — XP-80 dan chiqadi';
        } else {
          btn.disabled = false;
          msg.style.color = '#b91c1c';
          msg.textContent = (j && j.error) || 'Xato';
        }
      })
      .catch(function () {
        btn.disabled = false;
        msg.style.color = '#b91c1c';
        msg.textContent = 'Tarmoq xatosi';
      });
    });
  })();
  </script>

</body>
</html>
